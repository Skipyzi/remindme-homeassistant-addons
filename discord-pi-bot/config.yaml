name: RemindMe
version: "4.19.0"
slug: remindme_discord_bot
description: Your personal assistant in Home Assistant and Discord, on Claude, OpenAI or your ChatGPT and Claude subscriptions
arch:
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
ingress: true
ingress_port: 8090
panel_icon: mdi:robot-outline
panel_title: RemindMe
panel_admin: false
options:
  discord_token: ""
  owner_id: ""
  guild_id: ""
  ai_provider: claude
  anthropic_api_key: ""
  openai_api_key: ""
  ai_model: ""
  ai_effort: low
  daily_ai_budget: 2
  morning_brief_time: "07:00"
  bin_reminder_time: "19:00"
  quiet_hours: "22:30-07:00"
  battery_nudge_percent: 15
  chores_list: todo.chores
  gmail_address: ""
  gmail_app_password: ""
  gmx_address: ""
  gmx_password: ""
  mail_nudges: true
  smart_nudges: true
  inbox_sorter_url: http://local-inbox-sorter:8095
  playful_placeholders: true
  reminder_color: "5865f2"
  phone_app: true
  web_browser: true
  searxng_url: ""
  exa_api_key: ""
  ha_notify_target: ""
  vault_url: ""
  trackingmore_api_key: ""
schema:
  discord_token: password
  owner_id: str
  guild_id: str?
  ai_provider: list(claude|openai)
  anthropic_api_key: password?
  openai_api_key: password?
  ai_model: str?
  ai_effort: list(low|medium|high)
  daily_ai_budget: float(0,1000)
  morning_brief_time: str?
  bin_reminder_time: str?
  quiet_hours: str?
  battery_nudge_percent: int(0,100)
  chores_list: str?
  gmail_address: str?
  gmail_app_password: password?
  gmx_address: str?
  gmx_password: password?
  mail_nudges: bool
  smart_nudges: bool
  inbox_sorter_url: str?
  playful_placeholders: bool
  reminder_color: str
  phone_app: bool
  web_browser: bool
  searxng_url: str?
  exa_api_key: password?
  ha_notify_target: str?
  vault_url: str?
  trackingmore_api_key: password?
map:
  - type: data
    read_only: false
    path: /data
  # The Markdown vault lives here so the remindme-vault editor add-on and this
  # add-on share the same files; the assistant both reads and writes notes
  # (its memory), so rw.
  - type: share
    read_only: false
    path: /share
