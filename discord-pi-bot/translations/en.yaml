configuration:
  discord_token:
    name: Discord bot token
    description: The token of your Discord bot. Without it, only the console works.
  owner_id:
    name: Your Discord user ID
    description: The assistant answers only you, and sends the brief and nudges to your DMs.
  guild_id:
    name: Discord server ID
    description: Optional. Registers the slash commands on this server straight away.
  ai_provider:
    name: AI provider
    description: Which AI answers by default. You can switch in the console's AI settings without a restart.
  anthropic_api_key:
    name: Claude API key
    description: From console.anthropic.com. Billed per use, separate from a Claude subscription.
  openai_api_key:
    name: OpenAI API key
    description: From platform.openai.com.
  ai_model:
    name: Model
    description: Optional. The default provider's model. Blank uses Claude Opus 5.5 for Claude; pick one in the console for the others.
  ai_effort:
    name: Thinking effort
    description: How hard the AI thinks before answering on Discord and in tasks. Low is quick and cheap; high is slower and costs more.
  daily_ai_budget:
    name: Daily AI budget (USD)
    description: The assistant pauses for the day when it reaches this. Counted for Claude models only; 0 means no limit.
  morning_brief_time:
    name: Morning brief
    description: When to send your morning brief on Discord, as HH:MM. Blank turns it off.
  bin_reminder_time:
    name: Bin reminder
    description: When to remind you to put the bins out, the evening before collection, as HH:MM. Blank turns it off.
  quiet_hours:
    name: Quiet hours
    description: No nudges in this window, as HH:MM-HH:MM. They wait until it ends.
  battery_nudge_percent:
    name: Battery nudge
    description: Tell you when a device battery is at or below this percentage, once a week per device. 0 turns it off.
  chores_list:
    name: Chores list
    description: The to-do list that gets "Put the paper bin out" on the morning before a collection, such as todo.chores. Blank turns it off.
  gmail_address:
    name: Gmail address
    description: Optional, and better added in the console under Settings, Mail and calendars. Taken in as a connector once.
  gmail_app_password:
    name: Gmail app password
    description: Google Account, Security, 2-step verification, App passwords. Not your normal password.
  gmx_address:
    name: GMX address
    description: Optional, and better added in the console under Settings, Mail and calendars. Taken in as a connector once.
  gmx_password:
    name: GMX password
    description: Your GMX password, or an app password if you use 2-factor sign-in.
  mail_nudges:
    name: Mail nudges
    description: Message you on Discord about new bills and appointments, and the day before a bill is due.
  smart_nudges:
    name: Heads-ups
    description: A few times a day RemindMe looks across new mail, the next hours of your calendar, the house and its jobs, and messages you only about what can't wait. At most four a day; never in quiet hours.
  inbox_sorter_url:
    name: Inbox sorter
    description: The inbox sorter app's address, used to leave newsletters out. Blank uses mailing-list headers only.
  playful_placeholders:
    name: Playful placeholders
    description: Random placeholder text while a slash command is working.
  reminder_color:
    name: Reminder colour
    description: Accent colour of the reminder card, as a hex code.
  searxng_url:
    name: SearXNG URL
    description: Optional. Web search for the Claude Code and Codex agents. Claude, OpenAI and ChatGPT search the web themselves.
  exa_api_key:
    name: Exa API key
    description: Optional. Web search fallback for the Claude Code and Codex agents.
  phone_app:
    name: Phone app
    description: RemindMe joins your tailnet as its own device, so you can install it on your phone with its own notifications. Connect it under Settings, Phone app.
  web_browser:
    name: Web browser
    description: A headless Chromium on the Pi for pages that need one, such as tracking pages and shops. It browses signed out and can't reach your home network; buying, booking or sending waits for your tap.
  ha_notify_target:
    name: Phone notifications
    description: Optional. The phone with the Home Assistant app that gets RemindMe's notifications, with buttons and Live Activities, such as mobile_app_iphone. Picking a phone under Settings, Phone app, does the same and wins over this.
  vault_url:
    name: Vault editor URL
    description: Optional. Links notes to the RemindMe Vault editor app.
  trackingmore_api_key:
    name: TrackingMore API key
    description: Optional. Turns on parcel tracking.
