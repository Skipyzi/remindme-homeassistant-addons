name: Minecraft Server
version: "1.6.0"
slug: minecraft_server
description: Managed Minecraft server (PaperMC or Better than Adventure!) with world, backup and terrain-generation management
url: https://github.com/skipyzi/remindme-homeassistant-addons/tree/main/minecraft_server
arch:
  - aarch64
  - amd64
startup: services
boot: manual
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:minecraft
panel_title: Minecraft
panel_admin: true
hassio_api: true
hassio_role: default
services:
  - mqtt:want
ports:
  25565/tcp: 25565
ports_description:
  25565/tcp: Minecraft Java Edition (leave empty to keep the server LAN-only)
map:
  - type: data
    read_only: false
options:
  server_flavour: paper
  server_port: 25565
  memory_min_mb: 1024
  memory_max_mb: 3072
  jvm_flags_profile: balanced
  jvm_flags_custom: ""
  paper_version: ""
  run_server_as_root: false
  auto_restart_on_crash: false
  stop_timeout_seconds: 120
  mqtt_enabled: true
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: homeassistant
  chunky_source: modrinth
  chunky_download_url: ""
  chunky_sha256: ""
  allow_direct_access: false
  log_level: info
schema:
  server_flavour: list(paper|bta|babric)
  server_port: port
  memory_min_mb: int(512,12288)
  memory_max_mb: int(768,14336)
  jvm_flags_profile: list(low_power|balanced|performance|custom)
  jvm_flags_custom: str?
  paper_version: str?
  run_server_as_root: bool
  auto_restart_on_crash: bool
  stop_timeout_seconds: int(15,900)
  mqtt_enabled: bool
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_discovery_prefix: str
  chunky_source: list(modrinth|url|manual)
  chunky_download_url: str?
  chunky_sha256: str?
  allow_direct_access: bool
  log_level: list(debug|info|warning|error)
