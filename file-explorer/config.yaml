name: File Explorer
version: "0.3.0"
slug: file_explorer
description: Safe administrator-only file management through Home Assistant ingress
arch:
  - aarch64
  - amd64
  - armv7
build_from:
  aarch64: node:22-alpine
  amd64: node:22-alpine
  armv7: node:22-alpine
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8091
panel_icon: mdi:folder-cog-outline
panel_title: File Explorer
panel_admin: true
options:
  enable_config: true
  enable_share: true
  enable_media: true
  text_edit_max_bytes: 1048576
  search_file_max_bytes: 2097152
  upload_max_bytes: 104857600
  search_max_results: 500
  search_timeout_seconds: 15
  retention_days: 30
  storage_scan_max_entries: 200000
  storage_scan_timeout_seconds: 120
  storage_scan_cache_seconds: 60
  storage_map_max_nodes: 5000
  host_scan_max_entries: 1000000
  host_scan_timeout_seconds: 600
  host_scan_cache_seconds: 300
  host_map_max_nodes: 10000
schema:
  enable_config: bool
  enable_share: bool
  enable_media: bool
  text_edit_max_bytes: int(1024,10485760)
  search_file_max_bytes: int(1024,10485760)
  upload_max_bytes: int(1048576,1073741824)
  search_max_results: int(10,5000)
  search_timeout_seconds: int(1,120)
  retention_days: int(1,365)
  storage_scan_max_entries: int(1000,1000000)
  storage_scan_timeout_seconds: int(5,600)
  storage_scan_cache_seconds: int(5,3600)
  storage_map_max_nodes: int(100,10000)
  host_scan_max_entries: int(1000,1000000)
  host_scan_timeout_seconds: int(5,600)
  host_scan_cache_seconds: int(5,3600)
  host_map_max_nodes: int(100,10000)
privileged:
  - SYS_ADMIN
devices:
  - /dev/fuse
map:
  - type: homeassistant_config
    path: /config
    read_only: false
  - type: share
    read_only: false
  - type: media
    read_only: false
